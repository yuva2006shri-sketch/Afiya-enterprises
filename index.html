<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afiya Enterprises | Home Appliances</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #104778;
  background: #f5faff;
}

header {
  background: white;
  padding: 18px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px #dce8f2;
}

.logo h1 {
  margin: 0;
  font-size: 27px;
  color: #075b99;
}

.logo p {
  margin: 5px 0 0;
}

nav a {
  text-decoration: none;
  color: #104778;
  font-weight: bold;
  margin: 8px;
}

nav a:hover {
  color: #0785d1;
}

.hero {
  background: linear-gradient(120deg, #ccecff, #ffffff);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
  padding: 45px 6%;
}

.hero-content {
  flex: 1;
}

.hero h2 {
  font-size: 38px;
  margin: 0 0 15px;
  color: #075b99;
}

.hero p {
  font-size: 17px;
  line-height: 1.6;
}

.hero-image {
  flex: 1;
}

.hero-image img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 12px;
}

.btn {
  display: inline-block;
  background: #0785d1;
  color: white;
  padding: 12px 20px;
  margin: 5px 5px 5px 0;
  border-radius: 25px;
  text-decoration: none;
  font-weight: bold;
}

.whatsapp {
  background: #21a957;
}

.btn:hover {
  opacity: 0.85;
}

section {
  padding: 35px 5%;
  text-align: center;
}

.section-title {
  font-size: 30px;
  color: #075b99;
  margin-bottom: 8px;
}

.products {
  max-width: 1150px;
  margin: 25px auto 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border: 1px solid #d5eaff;
  border-radius: 13px;
  padding: 12px;
  box-shadow: 0 2px 8px #e1edf7;
}

.card img {
  width: 100%;
  height: 185px;
  object-fit: contain;
  border-radius: 8px;
  background: white;
}

.card h3 {
  margin: 12px 0 6px;
  color: #075b99;
}

.card p {
  margin: 8px 0 12px;
  line-height: 1.5;
}

.contact {
  background: #e2f3ff;
  line-height: 1.8;
}

.contact a:not(.btn) {
  color: #075b99;
}

footer {
  text-align: center;
  padding: 22px;
  background: #12456f;
  color: white;
}

@media (max-width: 700px) {
  header {
    justify-content: center;
    text-align: center;
  }

  nav {
    margin-top: 15px;
  }

  nav a {
    display: inline-block;
    font-size: 14px;
    margin: 7px;
  }

  .hero {
    flex-direction: column;
    text-align: center;
    padding: 35px 20px;
  }

  .hero h2 {
    font-size: 29px;
  }

  .hero-image img {
    height: 220px;
  }

  .products {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .card {
    padding: 8px;
  }

  .card img {
    height: 130px;
  }

  .card h3 {
    font-size: 16px;
  }

  .card .btn {
    padding: 10px 13px;
    font-size: 13px;
  }
}

@media (max-width: 380px) {
  .products {
    grid-template-columns: 1fr;
  }

  .card img {
    height: 200px;
  }
}
</style>
</head>

<header>
  <div
